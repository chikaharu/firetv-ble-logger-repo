name: Release APK

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/release-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Prepare release asset
        run: cp app/build/outputs/apk/debug/app-debug.apk firetv-ble-logger.apk

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.1.0
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" firetv-ble-logger.apk --clobber
          else
            gh release create "$TAG" firetv-ble-logger.apk \
              --title "Fire TV BLE Logger v0.1.0" \
              --notes "Passive BLE advertisement logger for Fire TV / Android. Debug APK for BLE/Continuity observation experiments." \
              --latest
          fi
